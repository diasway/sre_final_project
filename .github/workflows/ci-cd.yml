name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/shop-sre-api
  NAMESPACE: sre-prr
  KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure kubectl
        if: github.event_name == 'push' && env.KUBE_CONFIG_B64 != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          kubectl version --client
          kubectl cluster-info

      - name: Deploy Kubernetes manifests
        if: github.event_name == 'push' && env.KUBE_CONFIG_B64 != ''
        run: |
          kubectl apply -f k8s/base/
          kubectl apply -f k8s/observability/ || true
          kubectl -n $NAMESPACE set image deployment/shop-sre-api shop-sre-api=${IMAGE_NAME}:${{ github.sha }}
          kubectl -n $NAMESPACE rollout status deployment/shop-sre-api --timeout=180s
          kubectl -n $NAMESPACE get pods -o wide
