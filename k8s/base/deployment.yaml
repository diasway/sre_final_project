apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-sre-api
  namespace: sre-prr
  labels:
    app: shop-sre-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: shop-sre-api
  template:
    metadata:
      labels:
        app: shop-sre-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: shop-sre-api
          image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY/shop-sre-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_NAME
              value: shop-sre-api
            - name: APP_VERSION
              value: "1.0.0"
            - name: FAILURE_RATE
              value: "0.01"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
